name: 功能建议
description: 提出新能力或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解决什么问题
      description: 描述当前工作流中的痛点，而不是只写想要的功能
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 若涉及新依赖、注册表写入或新进程，请明确说明
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与取舍
  - type: checkboxes
    id: rules
    attributes:
      label: 约束确认
      options:
        - label: 不注入 explorer、不装全局钩子（R21 例外除外）
        - label: 不引入第三方运行期依赖（或已在下方论证必要性）
        - label: 不改变用户私有数据的存放位置
